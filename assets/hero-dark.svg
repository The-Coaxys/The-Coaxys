<text x="48" y="150" font-size="17" fill="#E9E5D9">I keep servers boring</text>
<text x="48" y="174" font-size="17" fill="#8B979D">so the interesting things can run.</text>
<text x="48" y="262" font-size="12" fill="#8B979D" letter-spacing="2">SELF-HOSTING / NETWORKING / AUTOMATION</text>
