<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Coaxys: infrastructure, self-hosting and automation">
<title>Coaxys</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.led{animation:b 3.2s ease-in-out infinite}
